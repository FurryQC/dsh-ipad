name: DSH

options:
  bundleIdPrefix: com.dsh
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  DSH:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - DSH.entitlements
      - path: Shared
    dependencies:
      - target: DSHBroadcast
    # No info: block on purpose -- XcodeGen would rewrite Info.plist and keep a second copy.
    # The repo plist is the single source, referenced through INFOPLIST_FILE.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsh.qc
        PRODUCT_NAME: DSH
        # Version name is chosen by the user for every delivery; build number matches it.
        MARKETING_VERSION: "b26"
        CURRENT_PROJECT_VERSION: "26"
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Quotes matter: bare NO is a YAML 1.1 boolean and XcodeGen writes false/0.
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # App Group shared by the app and the broadcast extension; the re-signing tool
        # must add the same group to both bundle ids.
        CODE_SIGN_ENTITLEMENTS: App/DSH.entitlements

  DSHBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes:
          - Info.plist
          - Broadcast.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsh.qc.broadcast
        PRODUCT_NAME: DSHBroadcast
        MARKETING_VERSION: "b26"
        CURRENT_PROJECT_VERSION: "26"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/Broadcast.entitlements

schemes:
  DSH:
    build:
      targets:
        DSH: all
    run:
      config: Debug
