name: DSH

options:
  bundleIdPrefix: com.dsh
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  DSH:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    # 涓嶇敤 XcodeGen 鐨?info: 鍧楋細瀹冧細閲嶅啓 Info.plist锛岀瓑浜庢妸 plist 澶嶅埗鎴愪袱浠姐€?    # 杩欓噷鍙€氳繃 INFOPLIST_FILE 鎸囧悜浠撳簱閲岄偅浠斤紝淇濇寔鍗曚竴鏉ユ簮銆?    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsh.ipad
        PRODUCT_NAME: DSH
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "11"
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 寮曞彿鏄繀瑕佺殑锛氳８ NO 鍦?YAML 1.1 閲屾槸甯冨皵 false锛孹codeGen 浼氭妸鍊煎啓鎴?false/0銆?        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"

schemes:
  DSH:
    build:
      targets:
        DSH: all
    run:
      config: Debug
